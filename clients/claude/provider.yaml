id: claude-openshell-oauth
display_name: Claude Code OAuth for OpenShell
description: Long-lived Claude Code setup-token routed through the OpenShell gateway
category: agent
inference_capable: true
credentials:
  - name: oauth_token
    description: Claude Code long-lived OAuth token
    env_vars: [CLAUDE_CODE_OAUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [oauth_token]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/claude, /usr/local/bin/claude, /usr/local/lib/node_modules/@anthropic-ai/**]
